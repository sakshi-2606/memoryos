name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run offline test suite
        env:
          # Clients are constructed (no network) during offline tests; a dummy
          # key satisfies OpenAI() construction. Integration tests are excluded.
          OPENAI_API_KEY: "sk-ci-dummy-not-used"
        run: python -m pytest -m "not integration" -v